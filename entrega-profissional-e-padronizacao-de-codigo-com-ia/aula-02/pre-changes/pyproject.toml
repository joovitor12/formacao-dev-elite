[project]
name = "aula-02-linting"
version = "0.1.0"
description = "Linting assistido por IA — confirmacao_entrega"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"example.py" = ["E402"]
