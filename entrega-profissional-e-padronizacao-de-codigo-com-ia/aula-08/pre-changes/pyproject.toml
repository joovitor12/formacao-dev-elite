[project]
name = "aula-08-mvp-chatbot"
version = "0.1.0"
description = "MVP Chatbot — Parlant + OpenRouter + pipeline"
requires-python = ">=3.11"
dependencies = [
    "parlant>=3.0.0",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"example.py" = ["E402"]
"verificar_arquitetura.py" = ["E402"]
"verificar_pipeline.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
